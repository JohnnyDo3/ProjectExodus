<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Main gradient - earth tones matching the theme -->
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#36763d"/>
      <stop offset="50%" style="stop-color:#429393"/>
      <stop offset="100%" style="stop-color:#d46643"/>
    </linearGradient>
    <!-- Sunrise gradient -->
    <linearGradient id="sunriseGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#d46643"/>
      <stop offset="50%" style="stop-color:#e8a05d"/>
      <stop offset="100%" style="stop-color:#fff5f0"/>
    </linearGradient>
    <!-- Night sky gradient -->
    <radialGradient id="starGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#6eb5ff"/>
      <stop offset="100%" style="stop-color:#020208"/>
    </radialGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="#020208"/>

  <!-- Horizon line / land -->
  <path d="M 56 320 Q 150 280 256 300 Q 362 320 456 290 L 456 456 Q 256 496 56 456 Z" fill="#36763d" opacity="0.9"/>

  <!-- Rising sun behind horizon -->
  <circle cx="256" cy="320" r="100" fill="url(#sunriseGrad)" opacity="0.95"/>

  <!-- Sun rays -->
  <g fill="#e8a05d" opacity="0.6">
    <path d="M 256 180 L 266 220 L 246 220 Z"/>
    <path d="M 340 220 L 310 240 L 300 225 Z"/>
    <path d="M 172 220 L 202 240 L 212 225 Z"/>
    <path d="M 370 280 L 330 290 L 335 275 Z"/>
    <path d="M 142 280 L 182 290 L 177 275 Z"/>
  </g>

  <!-- Stars in the night sky portion -->
  <g fill="#f0f0ff">
    <circle cx="120" cy="120" r="3"/>
    <circle cx="380" cy="100" r="2.5"/>
    <circle cx="200" cy="80" r="2"/>
    <circle cx="320" cy="140" r="2.5"/>
    <circle cx="90" cy="200" r="2"/>
    <circle cx="420" cy="180" r="3"/>
    <circle cx="150" cy="160" r="1.5"/>
    <circle cx="360" cy="60" r="2"/>
    <circle cx="280" cy="100" r="1.5"/>
    <circle cx="100" cy="260" r="2"/>
    <circle cx="400" cy="240" r="2"/>
  </g>

  <!-- Stylized "E" for Exodus - like a path/road leading to horizon -->
  <g fill="none" stroke="#f0f0ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main vertical of E -->
    <path d="M 180 380 L 180 440"/>
    <!-- Three horizontal lines of E, converging toward horizon like perspective -->
    <path d="M 180 380 L 280 360"/>
    <path d="M 180 410 L 260 400"/>
    <path d="M 180 440 L 280 430"/>
  </g>

  <!-- Walking figure silhouette heading toward sunrise -->
  <g fill="#1a1a2e">
    <!-- Body -->
    <ellipse cx="300" cy="390" rx="12" ry="20"/>
    <!-- Head -->
    <circle cx="300" cy="362" r="10"/>
    <!-- Legs in walking pose -->
    <path d="M 295 408 L 288 435" stroke="#1a1a2e" stroke-width="6" stroke-linecap="round"/>
    <path d="M 305 408 L 315 430" stroke="#1a1a2e" stroke-width="6" stroke-linecap="round"/>
    <!-- Arms -->
    <path d="M 290 385 L 275 395" stroke="#1a1a2e" stroke-width="5" stroke-linecap="round"/>
    <path d="M 310 385 L 325 378" stroke="#1a1a2e" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
