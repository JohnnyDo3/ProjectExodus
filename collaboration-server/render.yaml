# Render.com deployment configuration
# Deploy with: render deploy

services:
  - type: web
    name: exodus-collaboration-server
    env: node
    region: oregon
    plan: starter
    buildCommand: npm install && npm run build && npx prisma generate
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: exodus-postgres
          property: connectionString
      - key: HOCUSPOCUS_SECRET
        generateValue: true
      - key: PORT
        value: 1234

databases:
  - name: exodus-postgres
    plan: starter
    databaseName: exodus_collaboration
    user: exodus_user
